# Ingress Traefik (k3s) vers web. Accessible sur http://ecommerce.localhost:8081
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: ecommerce
spec:
  rules:
    - host: ecommerce.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
